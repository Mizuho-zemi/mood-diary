<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4e9">
<title>今日のきもち日記</title>
<style>
:root{color-scheme:light;--ink:#503b30;--muted:#887569;--orange:#cf6b37;--line:#eddfd1;--paper:#fff;--cream:#fff7ef}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.7}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible+label,textarea:focus-visible{outline:3px solid #b75b2c;outline-offset:4px}.shell{max-width:760px;margin:auto;padding:52px 24px 30px}.brand{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--orange);display:flex;align-items:center;gap:10px}.sun{width:25px;height:25px;border-radius:50%;background:#f6bc7f;display:inline-block;box-shadow:0 0 0 5px #ffe9d2}header{margin-bottom:32px}h1{font-size:clamp(26px,5vw,36px);letter-spacing:.06em;margin:22px 0 8px}header p{margin:0;color:var(--muted);font-size:14px}.date{font-size:13px;color:var(--muted);margin-bottom:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 8px 30px #93663906}fieldset{border:0;margin:0;padding:0;min-width:0}legend,.field-label{font-weight:700;font-size:15px}legend{padding:0;margin-bottom:18px}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mood{position:relative;min-width:0}.mood input{position:absolute;opacity:0;width:1px;height:1px}.mood label{display:flex;align-items:center;flex-direction:column;gap:7px;border:1px solid #f0e6dc;background:#fffcf9;border-radius:16px;padding:14px 3px 11px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}.mood label:hover{background:#fff0df;transform:translateY(-2px)}.mood input:checked+label{background:#ffe8d2;border:2px solid var(--orange);padding:13px 2px 10px}.emoji{font-size:32px;line-height:1.3}.mood-name{font-size:11px;white-space:nowrap}.write{margin-top:27px}.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}textarea{display:block;resize:vertical;width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;background:#fffdfa;padding:15px;color:var(--ink);font-size:16px}textarea::placeholder{color:#a99b8e}.save{width:100%;background:var(--orange);color:white;border:0;border-radius:13px;padding:13px 20px;margin-top:20px;font-weight:700;transition:background .15s}.save:hover{background:#b95b29}.notice{font-size:13px;margin:10px 0 0;min-height:22px;color:#a34b25}.privacy{text-align:center;font-size:12px;color:var(--muted);margin:16px 0 0}.history{margin-top:38px}.history-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h2{font-size:19px;margin:0}.total{font-size:12px;color:var(--muted)}.entries{display:grid;gap:12px}.empty{text-align:center;border:1px dashed #e4cfbc;border-radius:20px;padding:32px 20px;color:var(--muted)}.empty span{display:block;font-size:27px;margin-bottom:9px}.empty p{margin:0;font-size:13px}.entry{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:13px}.entry-emoji{font-size:30px}.entry-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.entry time{font-size:12px;color:var(--muted)}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:9px 0 0}.delete{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px 8px;border-radius:7px;flex-shrink:0}.delete:hover{background:#fff0e5;color:#a34223}footer{text-align:center;color:#a39488;font-size:11px;margin-top:36px;letter-spacing:.08em}[hidden]{display:none!important}@media(max-width:480px){.shell{padding:30px 18px 24px}.card{padding:22px 16px;border-radius:20px}.moods{gap:6px}.emoji{font-size:28px}.mood-name{font-size:10px}.mood label{padding-top:13px;padding-bottom:11px}.entry{padding:16px;gap:8px;grid-template-columns:36px minmax(0,1fr)}header{margin-bottom:25px}.history{margin-top:30px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><span class="sun" aria-hidden="true"></span>MOOD DIARY</div><h1>今日のきもち日記</h1><p>うれしい日も、そうじゃない日も。<br>いまのきもちを、そっと残しておこう。</p></header>
<section class="card" aria-label="新しい日記">
<div class="date" id="today"></div>
<form id="diary-form" novalidate>
<fieldset><legend>いま、どんなきもち？</legend><div class="moods">
<div class="mood"><input type="radio" name="mood" id="mood-0" value="😆"><label for="mood-0"><span class="emoji" aria-hidden="true">😆</span><span class="mood-name">最高！</span></label></div>
<div class="mood"><input type="radio" name="mood" id="mood-1" value="😊"><label for="mood-1"><span class="emoji" aria-hidden="true">😊</span><span class="mood-name">いい感じ</span></label></div>
<div class="mood"><input type="radio" name="mood" id="mood-2" value="😐"><label for="mood-2"><span class="emoji" aria-hidden="true">😐</span><span class="mood-name">ふつう</span></label></div>
<div class="mood"><input type="radio" name="mood" id="mood-3" value="😢"><label for="mood-3"><span class="emoji" aria-hidden="true">😢</span><span class="mood-name">しょんぼり</span></label></div>
<div class="mood"><input type="radio" name="mood" id="mood-4" value="😡"><label for="mood-4"><span class="emoji" aria-hidden="true">😡</span><span class="mood-name">もやもや</span></label></div>
</div></fieldset>
<div class="write"><div class="label-row"><label class="field-label" for="note">ひとこと、残してみよう</label><span class="count" id="count">0 / 300</span></div><textarea id="note" maxlength="300" placeholder="今日はどんな一日だった？" aria-describedby="count"></textarea></div>
<button class="save" type="submit">きもちを保存する</button>
<p class="notice" id="notice" role="status" aria-live="polite"></p>
</form></section>
<p class="privacy">記録はこのブラウザーに保存されます。<br>ブラウザーのデータを消すと、記録も削除されます。</p>
<section class="history" aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">これまでのきもち</h2><span class="total" id="total">0 件の記録</span></div><div class="empty" id="empty"><span aria-hidden="true">🌱</span><p>あなたのきもちを、ここから少しずつ。<br>最初のひとことを残してみませんか。</p></div><div class="entries" id="entries"></div></section>
<footer>一日ひとつ、自分にやさしい時間を。</footer>
</main>
<script>
'use strict';
const STORAGE_KEY = 'mood-diary.entries.v1';
const moods = ['😆','😊','😐','😢','😡'];
const form = document.querySelector('#diary-form');
const note = document.querySelector('#note');
const notice = document.querySelector('#notice');
const entriesNode = document.querySelector('#entries');
const formatDate = new Intl.DateTimeFormat('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'short'});
const formatTime = new Intl.DateTimeFormat('ja-JP', {hour:'2-digit',minute:'2-digit'});
document.querySelector('#today').textContent = formatDate.format(new Date());
let entries = [];
let storageReadable = true;
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw === null ? [] : JSON.parse(raw);
    if (!Array.isArray(data) || !data.every(item => item && typeof item.id === 'string' && moods.includes(item.mood) && typeof item.note === 'string' && typeof item.createdAt === 'string' && Number.isFinite(Date.parse(item.createdAt))) || new Set(data.map(item=>item.id)).size !== data.length) throw new Error('Invalid records');
    entries = data;
    storageReadable = true;
    return true;
  } catch {
    storageReadable = false;
    notice.textContent = '記録を読み込めませんでした。ブラウザーの保存設定をご確認ください。既存の記録は上書きしていません。';
    return false;
  }
}
function persist(next) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); entries = next; return true; }
  catch { notice.textContent = '保存できませんでした。ブラウザーの保存設定や空き容量をご確認ください。'; return false; }
}
function render() {
  entriesNode.replaceChildren();
  document.querySelector('#total').textContent = `${entries.length} 件の記録`;
  document.querySelector('#empty').hidden = entries.length > 0 || !storageReadable;
  for (const entry of [...entries].sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt))) {
    const article = document.createElement('article'); article.className = 'entry';
    const emoji = document.createElement('span'); emoji.className = 'entry-emoji'; emoji.textContent = entry.mood;
    const content = document.createElement('div');
    const top = document.createElement('div'); top.className = 'entry-top';
    const time = document.createElement('time'); time.dateTime = entry.createdAt;
    const date = new Date(entry.createdAt); time.textContent = `${formatDate.format(date)} ${formatTime.format(date)}`;
    const button = document.createElement('button'); button.type = 'button'; button.className = 'delete'; button.textContent = '削除'; button.setAttribute('aria-label', `${time.textContent}の記録を削除`);
    button.addEventListener('click', () => {
      if (!window.confirm('この記録を削除しますか？')) return;
      if (!load()) { render(); return; }
      if (persist(entries.filter(item=>item.id !== entry.id))) { render(); notice.textContent = '記録を削除しました。'; }
    });
    const text = document.createElement('p'); text.textContent = entry.note;
    top.append(time, button); content.append(top,text); article.append(emoji,content); entriesNode.append(article);
  }
}
note.addEventListener('input',()=>{document.querySelector('#count').textContent = `${note.value.length} / 300`;});
form.addEventListener('submit',event=>{
  event.preventDefault();
  const selected = form.querySelector('input[name="mood"]:checked');
  if (!selected) { notice.textContent = 'いまのきもちを選んでください。'; document.querySelector('#mood-0').focus(); return; }
  if (!note.value.trim()) { notice.textContent = 'ひとこと日記を入力してください。'; note.focus(); return; }
  if (!load()) { render(); return; }
  const entry = {id:crypto.randomUUID(), mood:selected.value, note:note.value.trim(), createdAt:new Date().toISOString()};
  if (persist([...entries,entry])) { form.reset(); document.querySelector('#count').textContent = '0 / 300'; render(); notice.textContent = '今日のきもちを保存しました。おつかれさま。'; }
});
window.addEventListener('storage',event=>{if(event.key === STORAGE_KEY || event.key === null) { load(); render(); }});
load(); render();
</script>
</body>
</html>
